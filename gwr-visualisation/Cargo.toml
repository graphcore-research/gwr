[package]
name = "gwr-visualisation"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Static web visualisations for GWR timetable and platform data"
documentation.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories = [
  "command-line-utilities",
  "development-tools::debugging",
  "parsing",
  "simulation",
  "visualization",
]
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gwr-visualisation"
path = "src/main.rs"
required-features = ["generator"]

[features]
default = ["generator"]
generator = [
  "dep:base64",
  "dep:clap",
  "dep:flate2",
  "dep:gwr-models",
  "dep:gwr-platform",
  "dep:gwr-timetable",
  "dep:same-file",
  "dep:serde_yaml",
]
web = ["dep:js-sys", "dep:wasm-bindgen", "dep:web-sys"]

[dependencies]
base64 = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
gwr-models = { path = "../gwr-models", version = "0.24.0", optional = true }
gwr-platform = { path = "../gwr-platform", version = "0.6.0", optional = true }
gwr-timetable = { path = "../gwr-timetable", version = "0.5.0", optional = true }
js-sys = { workspace = true, optional = true }
regex.workspace = true
same-file = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_yaml = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["CanvasRenderingContext2d", "CssStyleDeclaration", "DataTransfer", "Document", "DomTokenList", "DragEvent", "Element", "Event", "EventTarget", "HtmlButtonElement", "HtmlCanvasElement", "HtmlElement", "HtmlInputElement", "HtmlOptionElement", "HtmlSelectElement", "KeyboardEvent", "MouseEvent", "Node", "NodeList", "Performance", "Storage", "Window", "console"] }

[dev-dependencies]
tempfile.workspace = true
