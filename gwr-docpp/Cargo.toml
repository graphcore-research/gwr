[package]
name = "gwr-docpp"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Procedural Macros for Document Preprocessing"
documentation.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["documentation", "gwr"]
categories = ["development-tools", "text-processing"]
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
proc-macro = true
path = "src/lib.rs"

# `test = false` keeps the target defined so `cargo expand --test
# documentation-fixture` can select it, but excludes it from the default
# `cargo test` build.
[[test]]
name = "documentation-fixture"
path = "tests/fixtures/documentation.rs"
harness = false
test = false

[dependencies]
gwr-doc-builder = { path = "../gwr-doc-builder", version = "0.2.0" }
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
tempfile.workspace = true

[build-dependencies]
gwr-build = { path = "../gwr-build", version = "0.2.0" }

[dev-dependencies]
trybuild.workspace = true

[features]
default = []
asciidoctor = []
typst = []
