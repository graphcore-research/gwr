# Trusted implementation for GitHub Actions Dependabot updates. The PR wrapper
# loads this workflow from `main`, so only reviewed action versions can access
# `gwr-bot` credentials.
#
# Grouped cross-directory updates omit versions from their title and summary and
# repeat release information for each directory. Restore the usual summary form
# (`infra: bump actions/cache from 5 to 6`) and keep one copy of that information.
#
# Every update is amended and pushed with the App so CI runs against the final
# commit. Ungrouped security updates keep their existing message.
#
# See `.github/gwr-bot/gwr-bot-setup.md` for step-by-step instructions on
# provisioning the `gwr-bot` GitHub App and its Dependabot secrets.

name: Amend Dependabot GitHub Actions update (trusted)

on:
  workflow_call:
    secrets:
      GWR_BOT_CLIENT_ID:
        required: true
      GWR_BOT_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  amend-update:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Mint gwr-bot installation token
        id: gwr-bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GWR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GWR_BOT_PRIVATE_KEY }}

      - name: Check out the Dependabot branch
        uses: actions/checkout@v7
        with:
          # Amend the PR tip rather than the generated merge commit.
          ref: ${{ github.event.pull_request.head.ref }}
          # Include the parent required by `git commit --amend`.
          fetch-depth: 2
          # Keep the push token out of .git/config until gh auth setup-git runs.
          persist-credentials: false

      - name: Build update summary
        if: >-
          steps.metadata.outputs.dependency-group != ''
        id: summary
        env:
          UPDATED_DEPENDENCIES: >-
            ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail

          # Name the updated action in the summary.
          dependency=$(
            jq -er '
              map(.dependencyName) | unique |
              if length == 1 then .[0]
              else error("expected exactly one dependency in the group")
              end
            ' <<< "$UPDATED_DEPENDENCIES"
          )

          # Name the version being replaced in the summary.
          previous_version=$(
            jq -er --arg dependency "$dependency" '
              map(
                select(.dependencyName == $dependency) |
                .prevVersion |
                select(length > 0)
              ) | unique |
              if length == 1 then .[0]
              else error("expected exactly one previous version")
              end
            ' <<< "$UPDATED_DEPENDENCIES"
          )

          # Name the replacement version in the summary.
          new_version=$(
            jq -er --arg dependency "$dependency" '
              map(
                select(.dependencyName == $dependency) |
                .newVersion |
                select(length > 0)
              ) | unique |
              if length == 1 then .[0]
              else error("expected exactly one new version")
              end
            ' <<< "$UPDATED_DEPENDENCIES"
          )

          {
            echo "dependency=$dependency"
            echo "previous_version=$previous_version"
            echo "new_version=$new_version"
            echo "summary=infra: bump $dependency from $previous_version to $new_version"
          } >> "$GITHUB_OUTPUT"

      - name: Configure git identity from push token
        env:
          GH_TOKEN: ${{ steps.gwr-bot-token.outputs.token }}
          APP_SLUG: ${{ steps.gwr-bot-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          user_login="${APP_SLUG}[bot]"
          user_id=$(gh api "/users/${user_login}" --jq .id)
          git config user.name "$user_login"
          git config user.email "${user_id}+${user_login}@users.noreply.github.com"

      - name: Amend commit and update grouped PR
        env:
          DEPENDENCY: ${{ steps.summary.outputs.dependency }}
          DEPENDENCY_GROUP: ${{ steps.metadata.outputs.dependency-group }}
          GH_TOKEN: ${{ steps.gwr-bot-token.outputs.token }}
          NEW_VERSION: ${{ steps.summary.outputs.new_version }}
          PREVIOUS_VERSION: ${{ steps.summary.outputs.previous_version }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUMMARY: ${{ steps.summary.outputs.summary }}
        run: |
          set -euo pipefail

          if [[ -n "$DEPENDENCY_GROUP" ]]; then
            old_message="$RUNNER_TEMP/old-commit-message"
            new_message="$RUNNER_TEMP/new-commit-message"
            old_pr_body="$RUNNER_TEMP/old-pr-body"
            new_pr_body="$RUNNER_TEMP/new-pr-body"

            git log -1 --format=%B > "$old_message"
            gh pr view "$PR_NUMBER" --json body --jq .body > "$old_pr_body"

            python3 - \
              "$old_message" \
              "$new_message" \
              "$old_pr_body" \
              "$new_pr_body" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          dependency = os.environ["DEPENDENCY"]
          previous_version = os.environ["PREVIOUS_VERSION"]
          new_version = os.environ["NEW_VERSION"]
          summary = os.environ["SUMMARY"]
          header = f"Updates `{dependency}` from {previous_version} to {new_version}"
          dependabot_truncation = (
              "...\n\n_Description has been truncated_"
          )
          header_pattern = re.compile(
              rf"(?m)^{re.escape(header)}$"
          )


          def collapse_candidate(
              generated: str,
              tail: str,
              footer: str,
              truncated: bool,
          ) -> str | None:
              matches = header_pattern.finditer(generated)
              first = next(matches, None)
              if first is None:
                  return None

              for second in matches:
                  first_copy = generated[first.start() : second.start()]
                  block = first_copy.rstrip()
                  separator = first_copy[len(block) :]
                  if not separator:
                      continue

                  next_section = separator + block
                  remaining = generated[first.start() + len(block) :]
                  has_complete_repeat = False
                  while remaining.startswith(next_section):
                      remaining = remaining[len(next_section) :]
                      has_complete_repeat = True

                  if not has_complete_repeat:
                      continue

                  if remaining and not (
                      truncated
                      and (
                          next_section.startswith(remaining)
                          or footer.startswith(remaining)
                      )
                  ):
                      continue

                  return generated[: first.start()] + block + tail

              return None


          def collapse_repeated_sections(text: str, footer: str) -> str:
              # A valid complete footer is stronger evidence than a truncation
              # marker, since either string can occur inside release notes.
              for terminal, truncated in (
                  (footer, False),
                  (dependabot_truncation, True),
              ):
                  candidates = set()
                  ambiguous = False
                  end = len(text)
                  while (start := text.rfind(terminal, 0, end)) != -1:
                      tail_start = start + len(terminal)
                      tail = text[start:] if not truncated else text[tail_start:]
                      # A footer in the alleged suffix makes the complete and
                      # truncated interpretations indistinguishable.
                      if truncated and footer in tail:
                          ambiguous = True
                          end = start
                          continue
                      collapsed = collapse_candidate(
                          text[:start], tail, footer, truncated
                      )
                      if collapsed is not None:
                          candidates.add(collapsed)
                      end = start

                  if ambiguous or len(candidates) > 1:
                      return text
                  if candidates:
                      return candidates.pop()

              # If the structure is uncertain, preserve it byte-for-byte.
              return text


          old_message, new_message, old_pr_body, new_pr_body = map(
              Path, sys.argv[1:]
          )

          message = collapse_repeated_sections(
              old_message.read_text(encoding="utf-8"),
              "\n\n---\nupdated-dependencies:",
          )
          _, separator, body = message.partition("\n")
          new_message.write_text(
              summary + separator + body, encoding="utf-8"
          )

          pr_body = collapse_repeated_sections(
              old_pr_body.read_text(encoding="utf-8"),
              "\n\nDependabot will resolve any conflicts with this PR",
          )
          new_pr_body.write_text(pr_body, encoding="utf-8")
          PY

            gh pr edit "$PR_NUMBER" \
              --title "$SUMMARY" \
              --body-file "$new_pr_body"

            git commit --amend --file "$new_message"
          else
            # Ungrouped GitHub Actions security updates already include their
            # versions, but still need a gwr-bot authored SHA to trigger the
            # full CI run.
            git commit --amend --no-edit
          fi

          gh auth setup-git
          git push --force-with-lease origin "HEAD:${PR_HEAD_REF}"
