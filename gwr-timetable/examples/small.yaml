nodes:
  - id: input_tensor_0
    kind: tensor
    config:
      addr: 0x1_0000_0000
      dtype: fp16
      shape: [2, 224, 224]

  - id: input_tensor_1
    kind: tensor
    config:
      addr: 0x1_1000_0000
      dtype: fp16
      shape: [2, 224, 224]

  - id: pe_0_0_add
    kind: compute
    program:
      inputs: [A, B]
      outputs: [Y]
      assignments:
        - output: Y
          axes: [b, m, n]
          expr:
            {
              add:
                [
                  { read: { tensor: A, indices: [b, m, n] } },
                  { read: { tensor: B, indices: [b, m, n] } },
                ],
            }
    tiling: { sizes: { m: 16, n: 16 } }
    pe: pe_0_0

  - id: tensor_0_0_to_0_1
    kind: tensor
    config:
      addr: 0x2_0000_0000
      dtype: fp32
      shape: [2, 224, 224]

  - id: pe_0_1_add
    kind: compute
    program:
      inputs: [A, B]
      outputs: [Y]
      assignments:
        - output: Y
          axes: [b, m, n]
          expr:
            {
              add:
                [
                  { read: { tensor: A, indices: [b, m, n] } },
                  { read: { tensor: B, indices: [b, m, n] } },
                ],
            }
    tiling: { sizes: { m: 16, n: 16 } }
    pe: pe_0_1
    input_views:
      A:
        offsets:
          - 0
          - 0
          - 0
        shape:
          - 1
          - 224
          - 224
      B:
        offsets:
          - 1
          - 0
          - 0
        shape:
          - 1
          - 224
          - 224

  - id: tensor_0_1_to_1_0
    kind: tensor
    config:
      addr: 0x3_0000_0000
      dtype: fp32
      shape: [1, 224, 224]

  - id: input_tensor_2
    kind: tensor
    config:
      addr: 0x3_1000_0000
      dtype: fp32
      shape: [1, 224, 224]

  - id: pe_1_0_mul
    kind: compute
    program:
      inputs: [A, B]
      outputs: [Y]
      assignments:
        - output: Y
          axes: [b, m, n]
          expr:
            matrix_mac:
              accumulator: fp32
              over: [k]
              args:
                - { read: { tensor: A, indices: [b, m, k] } }
                - { read: { tensor: B, indices: [b, k, n] } }
    tiling: { sizes: { m: 16, n: 16, k: 16 } }
    pe: pe_1_0

  - id: output_tensor_0
    kind: tensor
    config:
      addr: 0x4_0000_0000
      dtype: fp32
      shape: [1, 224, 224]

edges:
  - from: input_tensor_0
    to: pe_0_0_add.A
    kind: data

  - from: input_tensor_1
    to: pe_0_0_add.B
    kind: data

  - from: pe_0_0_add.Y
    to: tensor_0_0_to_0_1
    kind: data

  - from: tensor_0_0_to_0_1
    to: pe_0_1_add.A
    kind: data

  - from: tensor_0_0_to_0_1
    to: pe_0_1_add.B
    kind: data

  - from: pe_0_1_add.Y
    to: tensor_0_1_to_1_0
    kind: data

  - from: tensor_0_1_to_1_0
    to: pe_1_0_mul.A
    kind: data

  - from: input_tensor_2
    to: pe_1_0_mul.B
    kind: data

  - from: pe_1_0_mul.Y
    to: output_tensor_0
    kind: data
