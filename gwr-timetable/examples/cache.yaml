nodes:
  - id: tensor_A
    kind: tensor
    config:
      addr: 0x1_0000_0000
      dtype: fp32
      shape: [8]

  - id: add
    kind: compute
    pe: pe0
    program:
      inputs: [A, B]
      outputs: [Y]
      assignments:
        - output: Y
          axes: [i]
          expr:
            {
              add:
                [
                  { read: { tensor: A, indices: [i] } },
                  { read: { tensor: B, indices: [i] } },
                ],
            }

  - id: tensor_C
    kind: tensor
    config:
      addr: 0x1_0000_0200
      dtype: fp32
      shape: [8]

edges:
  - from: tensor_A
    to: add.0
    kind: data

  - from: tensor_A
    to: add.1
    kind: data

  - from: add
    to: tensor_C
    kind: data
