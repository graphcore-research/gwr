nodes:
  - id: tensor_A
    kind: tensor
    config:
      addr: 0x1_0000_0000
      dtype: fp16
      shape: [3, 224, 224]

  - id: tensor_B
    kind: tensor
    config:
      addr: 0x1_1000_0000
      dtype: fp16
      shape: [3, 224, 224]

  - id: add
    kind: compute
    program:
      inputs: [A, B]
      outputs: [Y]
      assignments:
        - output: Y
          axes: [b, m, n]
          expr:
            {
              add:
                [
                  { read: { tensor: A, indices: [b, m, n] } },
                  { read: { tensor: B, indices: [b, m, n] } },
                ],
            }
    tiling: { sizes: { m: 16, n: 16 } }
    pe: pe_0_0

  - id: tensor_C
    kind: tensor
    config:
      addr: 0x1_2000_0000
      dtype: fp32
      shape: [3, 224, 224]

  - id: tensor_D
    kind: tensor
    config:
      addr: 0x1_3000_0000
      dtype: fp32
      shape: [3, 224, 224]

  - id: gemm
    kind: compute
    program:
      inputs: [A, B]
      outputs: [Y]
      assignments:
        - output: Y
          axes: [b, m, n]
          expr:
            matrix_mac:
              over: [k]
              args:
                - { read: { tensor: A, indices: [b, m, k] } }
                - { read: { tensor: B, indices: [b, k, n] } }
    tiling: { sizes: { m: 16, n: 16, k: 16 } }
    pe: pe_0_1

  - id: tensor_E
    kind: tensor
    config:
      addr: 0x1_4000_0000
      dtype: fp32
      shape: [3, 224, 224]

edges:
  - from: tensor_A
    to: add
    kind: data

  - from: tensor_B
    to: add
    kind: data

  - from: add
    to: tensor_C
    kind: data

  - from: tensor_C
    to: gemm.0
    kind: data

  - from: tensor_D
    to: gemm.1
    kind: data

  - from: gemm
    to: tensor_E
    kind: data
