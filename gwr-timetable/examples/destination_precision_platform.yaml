memory_maps:
  - name: mm
    devices: [mem]
operation_classes:
  arithmetic: { operations: [add], arity: 2 }
  exponential: { operations: [exp], arity: 1 }
  cast: { operations: [convert], arity: 1 }
defaults:
  pe_config: &fp32_then_bf16
    sram_bytes: 256
    compute:
      execution_units:
        vector:
          capabilities:
            - {
                class: arithmetic,
                input_dtypes: [[fp32, fp32]],
                ops_per_tick: 8,
              }
            - { class: exponential, input_dtypes: [[fp32]], ops_per_tick: 8 }
            - { class: cast, input_dtypes: [[fp32]], ops_per_tick: 8 }
processing_elements:
  - name: pe0
    memory_map: mm
    config: *fp32_then_bf16
memories:
  - name: mem
    kind: hbm
    base_address: 0
    config: { capacity_bytes: 1MiB }
connections:
  - connect: [pe.pe0, mem.mem]
