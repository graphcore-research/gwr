[package]
name = "gwr-spotter"
version = "0.10.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "TUI based viewer for trace files created by the gwr_track trace system"
documentation.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories = [
  "command-line-utilities",
  "development-tools::debugging",
  "parsing",
  "simulation",
]
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
capnp.workspace = true
clap.workspace = true
crossterm.workspace = true
gwr-track = { path = "../gwr-track", version = "0.13.0" }
itertools.workspace = true
log.workspace = true
ratatui.workspace = true
regex.workspace = true
tokio = { version = "1.45.1", features = ["macros", "net", "rt-multi-thread"] }

[build-dependencies]
gwr-build = { path = "../gwr-build", version = "0.2.0" }

[dev-dependencies]
serial_test.workspace = true
tower = { version = "0.5.2", features = ["util"] }

[features]
default = ["perfetto"]
perfetto = ["gwr-track/perfetto"]
