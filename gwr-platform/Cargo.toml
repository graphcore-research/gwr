[package]
name = "gwr-platform"
version = "0.14.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Library for defining and building execution platforms defined by configuration files"
documentation.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
functional = ["gwr-models/functional"]

[dependencies]
async-trait.workspace = true
byte-unit.workspace = true
clap.workspace = true
gwr-engine = { path = "../gwr-engine", version = "0.16.0" }
gwr-model-builder = { path = "../gwr-model-builder", version = "0.2.0" }
gwr-models = { path = "../gwr-models", version = "0.28.0" }
gwr-track = { path = "../gwr-track", version = "0.13.0" }
log.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
yaml_serde.workspace = true

[build-dependencies]
gwr-build = { path = "../gwr-build", version = "0.2.0" }

[dev-dependencies]
gwr-track = { path = "../gwr-track", version = "0.13.0", features = ["perfetto"] }
gwr-perfetto = { path = "../gwr-perfetto", version = "0.3.0" }
prost.workspace = true
tempfile.workspace = true
