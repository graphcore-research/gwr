operation_classes:
  add:
    operations: [add]
    arity: 2
  mul:
    operations: [mul]
    arity: 2
  compare:
    operations: [compare, maximum]
    arity: 2
  matrix:
    operations: [matrix_mac]
    arity: 2
    flops_per_op: 2

memory_maps:
  # The default memory map for Processing Elements
  - name: pe_memory_map
    devices:
      - hbm0

fabrics:
  - name: fabric0
    kind: functional
    columns: 2
    rows: 2
    config:
      routing: column-first

# A default PE config so that it doesn't have to be repeated
defaults:
  pe_config: &default_pe_config
    num_active_requests: 8
    lsu_access_bytes: 32
    sram_bytes: 0x20_0000 # 2MB of SRAM
    compute:
      execution_units:
        alu:
          capabilities:
            - { class: add, ops_per_tick: 16 }
            - { class: mul, ops_per_tick: 4 }
            - { class: compare, ops_per_tick: 16 }
        matrix:
          capabilities:
            - { class: matrix, accumulator: fp32, ops_per_tick: 32 }

processing_elements:
  - name: pe_0_0
    memory_map: pe_memory_map
    config: *default_pe_config
  # Leave fabric endpoint (0,1) unused and connect it to null below.
  - name: pe_1_0
    memory_map: pe_memory_map
    config: *default_pe_config
  # No need to create PE for 1,1 as the HBM is connected there

caches:
  - name: c2
    config:
      bw_bytes_per_tick: 32
      line_size_bytes: 32
      num_ways: 4
      num_sets: 128
      delay_ticks: 20

memories:
  - name: hbm0
    kind: hbm
    base_address: 0x1_0000_0000
    config:
      capacity_bytes: 16GiB
      delay_ticks: 10

connections:
  - connect:
      - pe.pe_0_0
      - fabric.fabric0@(0,0)
  - connect:
      # Quote null so YAML treats it as an endpoint string.
      - "null"
      - fabric.fabric0@(0,1)
  - connect:
      - pe.pe_1_0
      - cache.c2.dev
  - connect:
      - cache.c2.mem
      - fabric.fabric0@(1,0)
  - connect:
      - mem.hbm0
      - fabric.fabric0@(1,1)
