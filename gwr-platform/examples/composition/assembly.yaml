# Synthetic geometry for the 2-rack/4-board/8-package composition example.
# SI metres. All extents are assumed, not area estimates or vendor dimensions.
schema_version: 1
roots: [{ id: system, template: system }]
templates:
  system:
    kind: system
    role: group
    extent: { x: 4, y: 2, z: 2.2 }
    children:
      [{ id: rack, template: rack, count: 2, step: { x: 2, y: 0, z: 0 } }]
  rack:
    kind: rack
    role: group
    extent: { x: 0.8, y: 1.2, z: 2.2 }
    children:
      - id: board
        template: board
        count: 2
        transform: { translation: { x: 0.1, y: 0.1, z: 0.4 } }
        step: { x: 0, y: 0, z: 0.5 }
  board:
    kind: board
    role: group
    extent: { x: 0.6, y: 0.8, z: 0.08 }
    children:
      - id: chip
        template: package
        count: 2
        transform: { translation: { x: 0.05, y: 0.05, z: 0.005 } }
        step: { x: 0.25, y: 0, z: 0 }
  package:
    kind: package
    role: group
    extent: { x: 0.1, y: 0.1, z: 0.01 }
    children:
      - { id: substrate, template: substrate }
      - {
          id: logic,
          template: logic,
          transform: { translation: { x: 0.005, y: 0.005, z: 0.001 } },
        }
      - {
          id: hbm,
          template: hbm,
          transform: { translation: { x: 0.055, y: 0.005, z: 0.001 } },
        }
  substrate:
    kind: substrate
    role: carrier
    extent: { x: 0.1, y: 0.1, z: 0.0001 }
  logic:
    kind: die
    extent: { x: 0.02, y: 0.02, z: 0.0003 }
    children:
      - { id: cpu, template: cpu }
      - {
          id: noc,
          template: noc,
          transform: { translation: { x: 0.016, y: 0, z: 0 } },
        }
      - {
          id: sram,
          template: sram,
          transform: { translation: { x: 0, y: 0.016, z: 0 } },
        }
  cpu:
    kind: engine
    extent: { x: 0.015, y: 0.015, z: 0.0003 }
  noc:
    kind: router
    extent: { x: 0.004, y: 0.015, z: 0.0003 }
  sram:
    kind: memory_bank
    extent: { x: 0.015, y: 0.004, z: 0.0003 }
  hbm:
    kind: stack
    role: group
    extent: { x: 0.01, y: 0.01, z: 0.002 }
    children:
      - { id: base, template: hbm_base }
      - id: layer
        template: hbm_die
        count: 8
        transform: { translation: { x: 0, y: 0, z: 0.0001 } }
        step: { x: 0, y: 0, z: 0.00008 }
  hbm_base:
    kind: controller
    extent: { x: 0.01, y: 0.01, z: 0.0001 }
  hbm_die:
    kind: die
    extent: { x: 0.01, y: 0.01, z: 0.00006 }
