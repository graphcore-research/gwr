clocks:
  - name: default
    frequency_mhz: 1000
default_clock: default

memory_maps:
  - name: pe_memory_map
    devices:
      - hbm0
      - hbm1
  - name: coherency0_memory_map
    devices:
      - hbm0
  - name: coherency1_memory_map
    devices:
      - hbm1

processing_elements:
  - name: pe0
    memory_map: pe_memory_map
    config:
      num_active_requests: 8
      lsu_access_bytes: 32

caches:
  - name: l1_0
    coherency_managers:
      - cm0
      - cm1
    config:
      bw_bytes_per_tick: 32
      line_size_bytes: 32
      delay_ticks: 4

coherency_managers:
  - name: cm0
    memory_map: coherency0_memory_map
    config:
      line_size_bytes: 32
  - name: cm1
    memory_map: coherency1_memory_map
    config:
      line_size_bytes: 32

fabrics:
  - name: fabric0
    kind: functional
    columns: 1
    rows: 5
    config: {}

memories:
  - name: hbm0
    kind: hbm
    base_address: 0x1_0000_0000
    config:
      capacity_bytes: 1GiB
      delay_ticks: 20
  - name: hbm1
    kind: hbm
    base_address: 0x2_0000_0000
    config:
      capacity_bytes: 1GiB
      delay_ticks: 20

connections:
  - connect:
      - pe.pe0
      - cache.l1_0.dev
  - connect:
      - cache.l1_0.mem
      - fabric.fabric0@(0,2)
  - connect:
      - coherency_manager.cm0
      - fabric.fabric0@(0,3)
  - connect:
      - mem.hbm0
      - fabric.fabric0@(0,0)
  - connect:
      - coherency_manager.cm1
      - fabric.fabric0@(0,4)
  - connect:
      - mem.hbm1
      - fabric.fabric0@(0,1)
