operation_classes:
  add:
    operations: [add]
    arity: 2
  mul:
    operations: [mul]
    arity: 2
  compare:
    operations: [compare, maximum]
    arity: 2
  matrix:
    operations: [matrix_mac]
    arity: 2
    flops_per_op: 2
compute_profiles:
  basic_alu:
    engines:
      alu:
        capabilities:
          - { class: add, ops_per_tick: 16 }
          - { class: mul, ops_per_tick: 4 }
          - { class: compare, ops_per_tick: 16 }
      matrix:
        capabilities:
          - { class: matrix, ops_per_tick: 32 }
  wide_alu:
    engines:
      alu:
        capabilities:
          - { class: add, ops_per_tick: 128 }
          - { class: mul, ops_per_tick: 16 }
          - { class: compare, ops_per_tick: 128 }
      matrix:
        capabilities:
          - { class: matrix, ops_per_tick: 256 }
